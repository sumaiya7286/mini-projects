<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Demo Weather App</title>
  </head>
  <body>
    <div class="box">
      <h1>Weather Chart</h1>
      <input type="text" placeholder="city.." id="input-box">

      <h2 id="location"></h2>
      <img src="temp.svg" alt="" />
     
      <h2 id="temp"></h2>
      <h3>temperature</h3>


      <div class="info">
        <div class="left">
          <img src="humid.svg" alt="" />
          <h3 id="humid"></h3>
          <h3>Humidity</h3>
        </div>

        <div class="right">
          <img src="windspeed.svg" alt="" />
          <h3 id="windspeed"></h3>
          <h3>Wind Speed</h3>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
